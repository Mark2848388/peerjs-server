<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеозвонок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 95%;
        }
        
        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-wrapper {
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            min-height: 300px;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-start {
            background: #4CAF50;
            color: white;
        }
        
        .btn-start:hover {
            background: #45a049;
        }
        
        .btn-stop {
            background: #f44336;
            color: white;
        }
        
        .btn-stop:hover {
            background: #da190b;
        }
        
        .btn-mute {
            background: #2196F3;
            color: white;
        }
        
        .btn-mute:hover {
            background: #1976D2;
        }
        
        .btn-camera {
            background: #FF9800;
            color: white;
        }
        
        .btn-camera:hover {
            background: #f57c00;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .server-status {
            text-align: center;
            margin-bottom: 15px;
            font-size: 12px;
            color: #888;
        }
        
        .code-section {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .code-input {
            width: 80%;
            max-width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        @media (max-width: 768px) {
            .video-container {
                grid-template-columns: 1fr;
            }
            
            .btn {
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="server-status">Сервер: <span id="server-status">Проверка...</span></div>
        
        <div class="code-section">
            <strong>Комната</strong>
            <br>
            <input type="text" class="code-input" id="code-input" placeholder="Введите код комнаты (например: room_1)">
            <br>
            <button class="btn btn-start" onclick="connectRoom()">Подключиться</button>
            <button class="btn btn-start" onclick="createRoom()">Создать комнату</button>
            <div id="room-code-display"></div>
        </div>
        
        <div class="video-container">
            <div class="video-wrapper">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="video-label">Вы</div>
            </div>
            <div class="video-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">Собеседник</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-start" id="start-call" onclick="startCall()" disabled>Начать звонок</button>
            <button class="btn btn-stop" id="stop-call" onclick="stopCall()" disabled>Остановить</button>
            <button class="btn btn-mute" id="mute-btn" onclick="toggleMute()" disabled>🔇 Микрофон</button>
            <button class="btn btn-camera" id="camera-btn" onclick="toggleCamera()" disabled>📷 Камера</button>
        </div>
        
        <div class="status" id="status">Ожидание подключения...</div>
    </div>

    <script>
        // Конфигурация сервера
        const SERVER_URL = 'https://azena.onrender.com';
        
        let localStream = null;
        let peerConnection = null;
        let ws = null;
        let isMuted = false;
        let isCameraOff = false;
        let currentRoom = null;
        
        // Конфигурация WebRTC
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        // Инициализация при загрузке
        window.onload = async function() {
            await initializeMedia();
        };
        
        // Получение доступа к медиаустройствам
        async function initializeMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });
                
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('status').textContent = 'Медиаустройства готовы';
                
                // Включаем кнопки
                document.getElementById('start-call').disabled = false;
            } catch (error) {
                console.error('Ошибка доступа к медиаустройствам:', error);
                document.getElementById('status').textContent = 'Ошибка: Нет доступа к камере/микрофону';
            }
        }
        
        // Создать комнату
        async function createRoom() {
            if (!localStream) {
                await initializeMedia();
                return;
            }
            
            currentRoom = generateRoomId();
            document.getElementById('room-code-display').textContent = 'Комната: ' + currentRoom;
            document.getElementById('status').textContent = 'Комната создана. Ожидание собеседника...';
            
            await connectToServer();
        }
        
        // Подключиться по код комнаты
        async function connectRoom() {
            if (!localStream) {
                await initializeMedia();
                return;
            }
            
            const code = document.getElementById('code-input').value;
            if (!code) {
                document.getElementById('status').textContent = 'Ошибка: Не введен код комнаты';
                return;
            }
            
            currentRoom = code;
            document.getElementById('room-code-display').textContent = 'Комната: ' + currentRoom;
            document.getElementById('status').textContent = 'Подключено. Ожидание собеседника...';
            
            await connectToServer();
        }
        
        // Подключение к серверу
        async function connectToServer() {
            try {
                // Подключаемся к WebSocket
                ws = new WebSocket(`${SERVER_URL.replace('https', 'wss')}/ws`);
                
                ws.onopen = () => {
                    console.log('WebSocket подключен');
                    document.getElementById('status').textContent = 'Подключено к серверу. Ожидание собеседника...';
                    
                    // Создаем комнату
                    ws.send(JSON.stringify({
                        type: 'create_room',
                        roomId: currentRoom
                    }));
                };
                
                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    await handleMessage(message);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket ошибка:', error);
                    document.getElementById('status').textContent = 'Ошибка подключения к серверу';
                };
                
                // Включаем kнопки управления
                document.getElementById('start-call').disabled = true;
                document.getElementById('stop-call').disabled = false;
                document.getElementById('mute-btn').disabled = false;
                document.getElementById('camera-btn').disabled = false;
                
            } catch (error) {
                console.error('Ошибка подключения:', error);
                document.getElementById('status').textContent = 'Ошибка подключения к серверу';
            }
        }
        
        // Начать звонок
        async function startCall() {
            if (!localStream) {
                await initializeMedia();
                return;
            }
            
            document.getElementById('status').textContent = 'Подключение к серверу...';
            
            try {
                // Подключаемся к WebSocket
                ws = new WebSocket(`${SERVER_URL.replace('https', 'wss')}/ws`);
                
                ws.onopen = () => {
                    console.log('WebSocket подключен');
                    document.getElementById('status').textContent = 'Подключено. Ожидание собеседника...';
                    
                    // Создаем комнату
                    ws.send(JSON.stringify({
                        type: 'create_room',
                        roomId: generateRoomId()
                    }));
                };
                
                ws.onmessage = async (event) => {
                    const message = JSON.parse(event.data);
                    await handleMessage(message);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket ошибка:', error);
                    document.getElementById('status').textContent = 'Ошибка подключения к серверу';
                };
                
                // Включаем кнопки управления
                document.getElementById('start-call').disabled = true;
                document.getElementById('stop-call').disabled = false;
                document.getElementById('mute-btn').disabled = false;
                document.getElementById('camera-btn').disabled = false;
                
            } catch (error) {
                console.error('Ошибка подключения:', error);
                document.getElementById('status').textContent = 'Ошибка подключения к серверу';
            }
        }
        
        // Обработка сообщений
        async function handleMessage(message) {
            switch (message.type) {
                case 'room_created':
                    document.getElementById('status').textContent = 'Комната создана. Ожидание собеседника...';
                    break;
                    
                case 'peer_joined':
                    document.getElementById('status').textContent = 'Собеседник подключился!';
                    await createPeerConnection();
                    break;
                    
                case 'offer':
                    await handleOffer(message);
                    break;
                    
                case 'answer':
                    await handleAnswer(message);
                    break;
                    
                case 'ice_candidate':
                    if (peerConnection) {
                        await peerConnection.addIceCandidate(message.candidate);
                    }
                    break;
                    
                case 'peer_left':
                    document.getElementById('status').textContent = 'Собеседник отключился';
                    if (peerConnection) {
                        peerConnection.close();
                        peerConnection = null;
                    }
                    document.getElementById('remote-video').srcObject = null;
                    break;
            }
        }
        
        // Создание peer connection
        async function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            
            // Добавляем локальные треки
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            // Обработка удаленных треков
            peerConnection.ontrack = (event) => {
                const remoteVideo = document.getElementById('remote-video');
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };
            
            // Обработка ICE кандидатов
            peerConnection.onicecandidate = (event) => {
                if (event.candidate && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: event.candidate,
                        roomId: currentRoom
                    }));
                }
            };
            
            // Создаем предложение
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            
            ws.send(JSON.stringify({
                type: 'offer',
                sdp: offer,
                roomId: currentRoom
            }));
        }
        
        // Обработка предложения
        async function handleOffer(message) {
            await createPeerConnection();
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.sdp));
            
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'answer',
                sdp: answer,
                roomId: currentRoom
            }));
        }
        
        // Обработка ответа
        async function handleAnswer(message) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.sdp));
        }
        
        // Остановить звонок
        function stopCall() {
            if (ws) {
                ws.send(JSON.stringify({
                    type: 'leave',
                    roomId: currentRoom
                }));
                ws.close();
                ws = null;
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('status').textContent = 'Звонок завершен';
            
            document.getElementById('start-call').disabled = false;
            document.getElementById('stop-call').disabled = true;
            document.getElementById('mute-btn').disabled = true;
            document.getElementById('camera-btn').disabled = true;
        }
        
        // Переключение микрофона
        function toggleMute() {
            if (!localStream) return;
            
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });
            
            const button = document.getElementById('mute-btn');
            button.textContent = isMuted ? '🔇 Микрофон выкл' : '🎤 Микрофон';
        }
        
        // Переключение камеры
        function toggleCamera() {
            if (!localStream) return;
            
            isCameraOff = !isCameraOff;
            localStream.getVideoTracks().forEach(track => {
                track.enabled = !isCameraOff;
            });
            
            const button = document.getElementById('camera-btn');
            button.textContent = isCameraOff ? '📷 Камера выкл' : '📷 Камера';
        }
        
        // Генерация ID комнаты
        function generateRoomId() {
            return 'room_' + Math.random().toString(36).substr(2, 9);
        }
        
        // Обработка закрытия страницы
        window.onbeforeunload = function() {
            if (ws) {
                ws.close();
            }
            if (peerConnection) {
                peerConnection.close();
            }
        };
    </script>
</body>
</html>
