<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZENA.sch!</title>
    <!-- Подключаем твой CSS сюда -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ТУТ ТВОЙ ТЕКУЩИЙ ЛЕНДИНГ (все блоки с кнопками) -->

    <!-- СКРЫТЫЙ ЭКРАН ВИДЕОЗВОНКА (добавь это в конец body) -->
    <div id="call-screen" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 9999;">
        <video id="local-video" autoplay playsinline muted style="width: 30%; position: absolute; top: 10px; right: 10px; border-radius: 10px; border: 2px solid white;"></video>
        <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <!-- Кнопки управления звонком -->
        <div style="position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: center; gap: 20px;">
            <button onclick="toggleMic()" style="padding: 15px; border-radius: 50%;">🎤</button>
            <button onclick="toggleCam()" style="padding: 15px; border-radius: 50%;">📷</button>
            <button onclick="hangUp()" style="padding: 15px; border-radius: 50%; background: red; color: white;">📞</button>
        </div>
    </div>

    <!-- Подключаем Socket.io с сервера -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Твоя логика -->
    <script src="app.js"></script>
</body>
</html>
